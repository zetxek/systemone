description = "A demo site exercising the Systemone editorial-neubrutalism theme."

[home]
  headline = "Editorial neubrutalism, shipped as a Hugo theme."
  highlight = "editorial neubrutalism"
  description = "Systemone is hand-written CSS: square geometry, thin ink rules, hard offset shadows, and two controlled accent colors — acid lime and pink."

  [[home.actions]]
    label = "Read the posts"
    url = "/posts/"
    variant = "primary"

  [[home.actions]]
    label = "About this demo"
    url = "/about/"
    variant = "secondary"

# The small params API — see docs/DESIGN-SYSTEM.md §7 and README.md.
[design]
  appearance = "auto"     # auto | light | dark
  prose = "sans"          # sans | mono
  ornaments = true        # home-only decorative devices (later stage)
  lime = "#d4ff3f"
  pink = "#ee5ba6"
  containerMax = "1160px"

[features]
  copyCode = true            # progressive enhancement (later stage)
  postTOC = true             # still subject to heading-count threshold (later stage)
  appearanceToggle = true    # reader-facing auto/light/dark control in the header
